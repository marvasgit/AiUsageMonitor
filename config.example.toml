# AI Usage Monitor configuration. Every key is optional.
# Linux:   ~/.config/ai-usage-monitor/config.toml
# Windows: %APPDATA%\ai-usage-monitor\config.toml
# macOS:   ~/Library/Application Support/ai-usage-monitor/config.toml

always_on_top = false
order = ["claude", "openai", "copilot", "cursor", "minimax", "openrouter"]

[claude]
enabled = true
# context_limit = 200000
poll_seconds = 120               # minimum 60; shared token with Claude Code
# hide = ["personal"]            # account names; "default" = ~/.claude
# Extra accounts outside home or nested deeper:
# [[claude.accounts]]
# name = "work"
# dir = "/mnt/other/.claude"
# Windows: use forward slashes or single quotes, e.g. dir = 'D:\other\.claude'

[openai]
enabled = true
live_poll = true
# hide = []
# [[openai.accounts]]
# name = "work"
# dir = "~/projects/.codex-work"

[copilot]
enabled = true

[cursor]
enabled = true

[minimax]
enabled = true
api_key_env = "MINIMAX_API_KEY"
# region = "global"      # or "cn"
models = ["general"]

[openrouter]
enabled = true
api_key_env = "OPENROUTER_API_KEY"

[omp]                            # omp's Claude login (also off when [claude] is off)
enabled = true
db = "~/.omp/agent/agent.db"

[omo]                            # omo's Claude login (also off when [claude] is off)
enabled = true
auth = "~/.omo/agent/auth.json"

[notifications]                  # desktop alert when a window first crosses each threshold
enabled = true
thresholds = [80, 95]            # percent; alerts again after the window resets
