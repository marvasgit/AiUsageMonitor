[package]
name = "ai-usage-monitor"
version = "2.0.3"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Small native monitor for Claude, OpenAI and MiniMax subscription usage"

[lib]
name = "aum"
path = "src/lib.rs"

[[bin]]
name = "ai-usage-monitor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
toml = "1.1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
zeroize = "1.9"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.23"
notify-rust = "4.18"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1", features = ["vendored", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[dev-dependencies]
egui_kittest = "0.36"
httpmock = "0.8"
tempfile = "3"
filetime = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
