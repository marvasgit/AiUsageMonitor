name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the keychain code, which is compiled only there; it is not packaged.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/ai-usage-monitor
          cp target/release/ai-usage-monitor install.sh assets/ai-usage-monitor.desktop assets/icon.png config.example.toml README.md LICENSE dist/ai-usage-monitor/
          tar -C dist -czf ai-usage-monitor-linux-x86_64.tar.gz ai-usage-monitor
      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/ai-usage-monitor.exe,config.example.toml,README.md,LICENSE -DestinationPath ai-usage-monitor-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ai-usage-monitor-${{ runner.os }}
          path: |
            ai-usage-monitor-linux-x86_64.tar.gz
            ai-usage-monitor-windows-x86_64.zip
          if-no-files-found: ignore

  # On a push to main, releases the Cargo.toml version when no tag for it exists yet,
  # so merging a version bump publishes it; other merges only build.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release"
          else
            echo "releasing v$version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  release:
    # version is skipped on tag pushes, so check results explicitly instead of the default success().
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.tag != '')
    needs: [build, version]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      # Pinned to commits: this job can write to the repository.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum ai-usage-monitor-linux-x86_64.tar.gz ai-usage-monitor-windows-x86_64.zip > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Creates the tag at the merged commit when releasing from main.
          tag_name: ${{ needs.version.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ai-usage-monitor-linux-x86_64.tar.gz
            ai-usage-monitor-windows-x86_64.zip
            SHA256SUMS
